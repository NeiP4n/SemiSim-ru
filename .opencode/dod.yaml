stages:
- name: 'Этап 1 — каркас: извлечение и классификация строк'
  goal: Инструмент достаёт из JAR все константыUtf8 игры и надёжно отделяет видимый текст от ключей —
    на этом стоят словарь и патч
  done_when: python3 tools/extract.py > out/strings.json → код 0, out/strings.json содержит ключ forbidden_keys
    и список видимых строк
- name: 'Этап 2 — ядро: патч пула констант'
  goal: patch.py переписывает строковые константы в .class с пересчётом длин, не ломая индексы пула
  done_when: python3 tools/patch.py → код 0, out/SemiSim-2.2.1-ru.jar создан, python3 tools/patch.py --verify
    → все замены найдены
- name: Этап 3 — кириллица в шрифте 7x5
  goal: Генератор глифов добавляет кириллицу в Font7x5, чтобы подписи зондов на поле не были пустыми прямоугольниками
  done_when: python3 tools/font7x5.py → код 0, в out/font_report.json все 33 буквы А-Яа-яЁё присутствуют
- name: Этап 4 — словарь перевода
  goal: dict/translations.json переводит все видимые строки игры на русский и служит единственным источником
    правды
  done_when: python3 tools/check_dict.py → код 0, 0 непереведённых видимых строк, 0 переведённых ключей
- name: Этап 5 — справка и проверка целиком
  goal: Русская справка README.html/examples.html встроена в JAR, лаунчер и verify.sh доказывают работу
    игры
  done_when: bash tools/verify.sh → код 0, скриншот с русскими подписями, сохранение открывается
- name: 'Этап 6 — сборка дистрибутива'
  goal: tools/build_dist.sh собирает установщики для Windows и Linux и архив, чтобы раздача была одной
    командой; состав архива проверяет оракул установщика
  done_when: bash tools/build_dist.sh → код 0, dist/SemiSim-ru-setup.zip, проверка состава каждого
    установщика зелёная
  depends_on:
  - Этап 5 — справка и проверка целиком
- name: 'Этап 7 — установщик с переводом внутри и classpath вместо замены JAR'
  goal: setup.exe несёт весь перевод внутри себя и включает его через classpath, не изменяя ни одного
    файла игры — тогда Steam не возвращает оригинал и перевод можно раздавать публично
  done_when: python3 tools/check_installer.py → код 0 и «установщик цел, внутри только перевод и справка»;
    bash tools/build_dist.sh → dist/SemiSim-ru-setup.zip без файлов игры
  depends_on:
  - 'Этап 6 — сборка дистрибутива'
- name: 'Этап 8 — портативный набор без установщика'
  goal: архив рядом с установщиком — файлы перевода плюс скрипты копирования, чтобы перевод включался
    и без запуска exe, и простым копированием файлов руками
  done_when: 'bash tools/build_portable.sh → код 0 и строка «ИТОГ: архив цел»; распакованный архив
    после запуска скрипта даёт рабочую игру на русском'
  depends_on:
  - 'Этап 7 — установщик с переводом внутри и classpath вместо замены JAR'
